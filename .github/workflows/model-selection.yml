name: Refresh skill models
on:
  schedule:
    - cron: '17 2 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [mise.toml, .github/workflows/model-selection.yml, scripts/check-repo.py]
permissions:
  contents: write
jobs:
  refresh:
    if: github.event_name != 'push'
    concurrency:
      group: kafstyler-main-model-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise run model-select --write
      - name: Commit new selection
        run: |
          git add .agents/model-selection.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: refresh measured model selection'
          git push origin HEAD:refs/heads/main
  verify-mise:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise run check
